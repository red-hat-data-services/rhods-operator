apiVersion: v1
kind: Service
metadata:
  name: grid-operator-swim
  labels:
    app.kubernetes.io/name: grid-operator
    app.kubernetes.io/instance: grid-operator
spec:
  type: "LoadBalancer"
  externalTrafficPolicy: "Local"
  publishNotReadyAddresses: true
  ports:
    - name: swim-udp
      port: 7946
      targetPort: swim-udp
      protocol: UDP
  selector:
    app.kubernetes.io/name: grid-operator
    app.kubernetes.io/instance: grid-operator
