apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: modelcacheentries.modelexpress.nvidia.com
spec:
  group: modelexpress.nvidia.com
  names:
    categories: []
    kind: ModelCacheEntry
    plural: modelcacheentries
    shortNames:
    - mxcache
    singular: modelcacheentry
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.modelName
      name: Model
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.lastUsedAt
      name: LastUsed
      type: date
    - jsonPath: .status.claimId
      name: Claim
      priority: 1
      type: string
    - jsonPath: .status.leaseExpiresAt
      name: Lease
      priority: 1
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ModelExpress model-download lifecycle metadata
        properties:
          spec:
            description: ModelCacheEntry spec - desired state. One CR per cached model.
            properties:
              modelName:
                description: Full model name (e.g., `meta-llama/Llama-3.1-70B`). Preserved in spec so operators can recover the original name even when the CR's metadata.name is a sanitized/hashed form.
                type: string
              provider:
                description: Provider string — `"HuggingFace"`, `"Ngc"`, `"Gcs"`, or `"S3"`.
                enum:
                - HuggingFace
                - Ngc
                - Gcs
                - S3
                type: string
            required:
            - modelName
            - provider
            type: object
          status:
            description: ModelCacheEntry status - observed state.
            nullable: true
            properties:
              claimId:
                description: Opaque identity of the replica that currently owns a download.
                nullable: true
                type: string
              createdAt:
                description: RFC3339 timestamp of first write. Omitted until the first status patch.
                format: date-time
                nullable: true
                type: string
              lastUsedAt:
                description: RFC3339 timestamp of most recent status write or touch.
                format: date-time
                nullable: true
                type: string
              leaseExpiresAt:
                description: Owner-generated RFC3339 heartbeat deadline. Observers use changes in this value to measure liveness locally instead of comparing clocks across replicas.
                format: date-time
                nullable: true
                type: string
              message:
                description: Optional human-readable message (download progress, error reason).
                nullable: true
                type: string
              phase:
                default: ''
                description: One of `"Downloading"`, `"Downloaded"`, `"Error"`. Empty string on freshly-created records that haven't yet received a status patch.
                enum:
                - ''
                - Downloading
                - Downloaded
                - Error
                type: string
            type: object
        required:
        - spec
        title: ModelCacheEntry
        type: object
    served: true
    storage: true
    subresources:
      status: {}
