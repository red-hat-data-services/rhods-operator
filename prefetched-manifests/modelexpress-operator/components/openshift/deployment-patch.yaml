apiVersion: apps/v1
kind: Deployment
metadata:
  name: modelexpress-operator
spec:
  template:
    metadata:
      annotations:
        prometheus.io/port: '8443'
        prometheus.io/scheme: https
    spec:
      containers:
      - env:
        - name: MXOP_METRICS_TLS_DIR
          value: /etc/modelexpress-operator/metrics-tls
        - name: RELATED_IMAGE_ODH_MODELEXPRESS_IMAGE
          value: set from params.env
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        name: operator
        ports:
        - containerPort: 8081
          name: http-health
        - containerPort: 8443
          name: https-metrics
        volumeMounts:
        - mountPath: /etc/modelexpress-operator/metrics-tls
          name: metrics-tls
          readOnly: true
      volumes:
      - name: metrics-tls
        secret:
          secretName: modelexpress-operator-metrics-tls
