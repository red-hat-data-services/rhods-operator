apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
- path: deployment-patch.yaml
  target:
    kind: Deployment
    name: modelexpress-operator
- path: service-patch.yaml
  target:
    kind: Service
    name: modelexpress-operator-metrics
- path: networkpolicy-patch.yaml
  target:
    kind: NetworkPolicy
    name: modelexpress-operator
resources:
- openshift-clusterrole.yaml
- openshift-clusterrolebinding.yaml
