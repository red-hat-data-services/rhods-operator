apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: modelexpress-operator
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
          - openshift-monitoring
          - openshift-user-workload-monitoring
          - redhat-ods-monitoring
    ports:
    - port: 8443
      protocol: TCP
