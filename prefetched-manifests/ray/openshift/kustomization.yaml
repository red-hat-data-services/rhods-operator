apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The ODH operator sets this to the applications namespace at deploy time.
namespace: opendatahub

configMapGenerator:
- name: ray-module-operator-config
  envs:
    - params.env

configurations:
  - params.yaml

vars:
- name: namespace
  objref:
    kind: ConfigMap
    name: ray-module-operator-config
    apiVersion: v1
  fieldref:
    fieldpath: data.namespace
- name: image
  objref:
    kind: ConfigMap
    name: ray-module-operator-config
    apiVersion: v1
  fieldref:
    fieldpath: data.odh-ray-module-operator-image
- name: odh-kuberay-operator-controller-image
  objref:
    kind: ConfigMap
    name: ray-module-operator-config
    apiVersion: v1
  fieldref:
    fieldpath: data.odh-kuberay-operator-controller-image
- name: odh-kube-rbac-proxy-image
  objref:
    kind: ConfigMap
    name: ray-module-operator-config
    apiVersion: v1
  fieldref:
    fieldpath: data.odh-kube-rbac-proxy-image

resources:
- ../default
- ray_operator_scc.yaml

commonLabels:
  app.kubernetes.io/name: ray-module-operator
  app.kubernetes.io/component: ray-module-operator

patches:
- path: remove_default_namespace.yaml
- path: controller-manager-image-patch.yaml
  target:
    group: apps
    version: v1
    kind: Deployment
    name: ray-module-operator-controller-manager
- path: controller-manager-env-patch.yaml
  target:
    group: apps
    version: v1
    kind: Deployment
    name: ray-module-operator-controller-manager
