apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../default
- ../../monitoring/llmisvc
- llm-svc-scc.yaml
- network-policies.yaml
- user-cluster-roles.yaml

namespace: opendatahub

patches:
- path: patches/remove-clusterservingruntime.yaml
- path: patches/remove-cert-manager.yaml
- path: patches/remove-local-model.yaml
- path: patches/patch-webhook-svc-openshift-cert-injection.yaml
- path: patches/patch-inferenceservice-config.yaml
- path: patches/patch-set-resources-manager.yaml
- target:
    kind: MutatingWebhookConfiguration
  patch: |
    - op: remove
      path: /metadata/annotations/cert-manager.io~1inject-ca-from
    - op: add
      path: /metadata/annotations/service.beta.openshift.io~1inject-cabundle
      value: "true"
- target:
      kind: CustomResourceDefinition
      name: inferenceservices.serving.kserve.io
  patch: |
    - op: remove
      path: /metadata/annotations/cert-manager.io~1inject-ca-from
    - op: add
      path: /metadata/annotations/service.beta.openshift.io~1inject-cabundle
      value: "true"
- target:
    kind: ValidatingWebhookConfiguration
  patch: |
    - op: remove
      path: /metadata/annotations/cert-manager.io~1inject-ca-from
    - op: add
      path: /metadata/annotations/service.beta.openshift.io~1inject-cabundle
      value: "true"

replacements:
- source:
    kind: ConfigMap
    name: kserve-parameters
    fieldPath: data.kserve-controller
  targets:
  - select:
      kind: Deployment
      name: kserve-controller-manager
    fieldPaths:
    - spec.template.spec.containers.[name=manager].image

configMapGenerator:
- envs:
  - params.env
  name: kserve-parameters

generatorOptions:
  disableNameSuffixHash: true

vars:
- fieldref:
    fieldpath: data.kserve-storage-initializer
  name: kserve-storage-initializer
  objref:
    apiVersion: v1
    kind: ConfigMap
    name: kserve-parameters
- fieldref:
    fieldpath: data.kserve-agent
  name: kserve-agent
  objref:
    apiVersion: v1
    kind: ConfigMap
    name: kserve-parameters
- fieldref:
    fieldpath: data.kserve-router
  name: kserve-router
  objref:
    apiVersion: v1
    kind: ConfigMap
    name: kserve-parameters
- fieldref:
    fieldpath: data.oauth-proxy
  name: oauth-proxy
  objref:
    apiVersion: v1
    kind: ConfigMap
    name: kserve-parameters
- fieldref:
    fieldpath: data.kube-rbac-proxy
  name: kube-rbac-proxy
  objref:
    apiVersion: v1
    kind: ConfigMap
    name: kserve-parameters

configurations:
- params.yaml
