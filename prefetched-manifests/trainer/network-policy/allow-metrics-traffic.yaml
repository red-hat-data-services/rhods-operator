# Restrict metrics (:8443) to in-namespace clients and the monitoring stacks
# that actually scrape this operator. The kubebuilder "metrics: enabled"
# namespace label is not used: e2e and OpenShift/RHOAI monitoring do not set it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: trainer-operator
    app.kubernetes.io/managed-by: kustomize
  name: allow-metrics-traffic
  namespace: system
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: trainer-operator
  policyTypes:
    - Ingress
  ingress:
    # Same namespace: Kind e2e curl pod and in-namespace debug.
    - from:
        - podSelector: {}
      ports:
        - port: 8443
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
      ports:
        - port: 8443
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
      ports:
        - port: 8443
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redhat-ods-monitoring
      ports:
        - port: 8443
          protocol: TCP
