apiVersion: aihub.opendatahub.io/v1alpha1
kind: Catalog
metadata:
  name: catalog
  namespace: opendatahub
spec:
  # Empty fields use the release images supplied by the product operator.
  # Set either field to stable to follow its ImageStream, or pin a sha256 digest.
  # Failed imports or invalid selections stop serving until a successful
  # import or valid manual selection restores it.
  catalogDataImageStream: ""
  benchmarkDataImageStream: ""
  resources:
    catalog:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    postgres:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  database:
    volume:
      sizeLimit: "10Gi"
  # proxy:
  #   httpProxy: "http://proxy.example.com:3128"
  #   httpsProxy: "http://proxy.example.com:3128"
  #   noProxy: ".svc,.cluster.local,localhost"
