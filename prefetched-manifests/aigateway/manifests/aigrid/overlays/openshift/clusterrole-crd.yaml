# Source: grid-operator/templates/clusterrole-crd.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grid-operator-crd
  labels:
    app.kubernetes.io/name: grid-operator
    app.kubernetes.io/instance: grid-operator
rules:
  - apiGroups: ["grid.praxis.fast"]
    resources:
      - agenttoolproviders
      - gridnetworks
      - inferenceproviders
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["grid.praxis.fast"]
    resources:
      - gridsites
    verbs: ["get", "list", "watch", "patch", "create", "update", "delete"]
  - apiGroups: ["grid.praxis.fast"]
    resources:
      - agenttoolproviders/status
      - gridnetworks/status
      - gridsites/status
      - inferenceproviders/status
    verbs: ["get", "patch"]
