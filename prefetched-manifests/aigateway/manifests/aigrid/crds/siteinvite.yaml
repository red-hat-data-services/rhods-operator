apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: siteinvites.grid.praxis.fast
spec:
  group: grid.praxis.fast
  names:
    kind: SiteInvite
    plural: siteinvites
    singular: siteinvite
  scope: Cluster
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.siteName
          name: Site
          type: string
        - jsonPath: .status.expiresAt
          name: Expires
          type: date
        - jsonPath: .status.conditions[?(@.type=='Available')].status
          name: Available
          type: string
        - jsonPath: .status.conditions[?(@.type=='Progressing')].status
          name: Progressing
          type: string
        - jsonPath: .status.conditions[?(@.type=='Degraded')].status
          name: Degraded
          type: string
        - jsonPath: .status.conditions[?(@.type=='Available')].lastTransitionTime
          name: Since
          type: date
        - jsonPath: .status.conditions[?(@.type=='Available')].message
          name: Message
          priority: 1
          type: string
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: Auto-generated derived type for SiteInviteSpec via `CustomResource`
          properties:
            spec:
              description: An invitation that authorizes one site to request admission.
              properties:
                allowDeletedName:
                  default: false
                  description: Whether a deleted site name may enroll again.
                  type: boolean
                jurisdictions:
                  description: Jurisdiction labels assigned to the site.
                  items:
                    maxLength: 63
                    type: string
                  maxItems: 8
                  minItems: 1
                  type: array
                  x-kubernetes-list-type: set
                lifetime:
                  default: 24h
                  description: Optional lifetime, from 5m through 168h.
                  format: duration
                  pattern: ^([0-9]+(ns|us|µs|ms|s|m|h))+$
                  type: string
                publicKeySHA256:
                  description: Optional SHA-256 digest of the bound public key.
                  nullable: true
                  pattern: ^[0-9a-f]{64}$
                  type: string
                siteName:
                  description: Site name pinned by the signer.
                  maxLength: 63
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                  type: string
              required:
                - jurisdictions
                - siteName
              type: object
              x-kubernetes-validations:
                - message: SiteInvite spec is immutable; delete and recreate it to change an invitation
                  rule: self == oldSelf
                - message: each jurisdiction must be a DNS label
                  rule: self.jurisdictions.all(j, j.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'))
                - message: lifetime must be between 5m and 168h
                  rule: self.lifetime >= duration('5m') && self.lifetime <= duration('168h')
            status:
              description: Observed invitation state.
              nullable: true
              properties:
                conditions:
                  description: Standard condition-shaped lifecycle status.
                  items:
                    description: A `SiteInvite` status condition.
                    properties:
                      lastTransitionTime:
                        description: RFC 3339 time of the last transition.
                        format: date-time
                        type: string
                      message:
                        description: Human-readable diagnostic.
                        type: string
                      observedGeneration:
                        description: Generation this condition describes.
                        format: int64
                        type: integer
                      reason:
                        description: Stable machine-readable reason.
                        type: string
                      status:
                        description: Condition status.
                        pattern: ^(True|False|Unknown)$
                        type: string
                      type:
                        description: Condition type.
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - observedGeneration
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                expiresAt:
                  description: Token expiry in RFC 3339 format.
                  format: date-time
                  nullable: true
                  type: string
                observedGeneration:
                  default: 0
                  description: Last observed generation.
                  format: int64
                  type: integer
                publicKeySHA256:
                  description: Public key digest accepted by the signer.
                  nullable: true
                  type: string
                redeemedBy:
                  description: CSR name that redeemed this invitation.
                  nullable: true
                  type: string
                secretRef:
                  description: Secret containing the one-time token.
                  nullable: true
                  properties:
                    key:
                      description: Data key holding the token.
                      type: string
                    name:
                      description: Secret name.
                      type: string
                    namespace:
                      description: Secret namespace.
                      type: string
                  required:
                    - key
                    - name
                    - namespace
                  type: object
                tokenId:
                  description: Public token identifier; the token secret is never stored here.
                  nullable: true
                  type: string
              type: object
          required:
            - spec
          title: SiteInvite
          type: object
      served: true
      storage: true
      subresources:
        status: {}
