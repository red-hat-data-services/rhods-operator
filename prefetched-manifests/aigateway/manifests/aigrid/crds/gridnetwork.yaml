                                    nullable: true
                                    properties:
                                      key:
                                        description: Optional key containing the CA bundle. Defaults to `ca.crt`.
                                        minLength: 1
                                        nullable: true
                                        type: string
                                      name:
                                        description: Secret name in the target gateway namespace.
                                        minLength: 1
                                        type: string
                                    required:
