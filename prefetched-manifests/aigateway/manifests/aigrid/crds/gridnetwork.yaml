                                    type: object
                                  mode:
                                    description: 'Transport mode: `mutual_tls`, `tls`, or explicit `plaintext`.'
                                    enum:
                                      - mutual_tls
                                      - tls
                                      - plaintext
                                    type: string
                                  sni:
                                    description: TLS Server Name Indication, required when mode is `mutual_tls` or `tls`.
                                    nullable: true
                                    type: string
                                required:
