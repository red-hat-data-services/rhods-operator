apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gridnetworks.grid.praxis.fast
spec:
  group: grid.praxis.fast
  names:
    kind: GridNetwork
    plural: gridnetworks
    shortNames:
      - gnw
    singular: gridnetwork
  scope: Cluster
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.gridId
          name: Grid ID
          type: string
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .status.connectedSites
          name: Sites
          type: integer
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: Auto-generated derived type for GridNetworkSpec via `CustomResource`
          properties:
            spec:
              description: |-
                Specification for a [`GridNetwork`].

                Defines the grid's seed peers, gateway associations, SWIM
                tuning, and TLS secret references.
              properties:
                admissionPolicy:
                  description: |-
                    Provider admission and pressure-recovery policy.

                    When omitted, Grid preserves the historical instantaneous admission
                    behaviour and providers without metrics remain eligible. Stabilized
                    pressure transitions require an active metrics scoring strategy and a
                    matching provider signal name. Without those, the observation is
                    `NotConfigured` and the provider remains `new_and_existing`; the
                    `missingMetrics` policy applies only after a configured signal is
                    missing or stale.
                  nullable: true
                  properties:
                    missingMetrics:
                      default: existingOnly
                      description: Fail-closed state for missing or expired metrics.
                      enum:
                        - existingOnly
                        - excluded
                      type: string
                    mode:
                      default: instantaneous
                      description: Admission evaluation mode.
                      enum:
                        - instantaneous
                        - stabilized
                      type: string
                    pressure:
                      default:
                        enterThreshold: 0.85
                        exitThreshold: 0.7
                        failureThreshold: 2
                        minimumStateDuration: 10s
                        recoveryHoldDown: 30s
                        successThreshold: 3
                      description: Pressure and recovery thresholds.
                      properties:
                        enterThreshold:
                          description: Pressure level at which a provider is considered saturated.
                          format: double
                          maximum: 1.0
                          minimum: 0.0
                          type: number
                        exitThreshold:
                          description: Lower pressure level required before recovery can begin.
                          format: double
                          maximum: 1.0
                          minimum: 0.0
                          type: number
                        failureThreshold:
                          description: Consecutive pressure observations required to enter `existingOnly`.
                          format: uint32
                          maximum: 100.0
                          minimum: 1.0
                          type: integer
                        minimumStateDuration:
                          description: Minimum time a state must remain active before changing.
                          pattern: ^[1-9][0-9]*s$
                          type: string
                        recoveryHoldDown:
                          description: Additional time to hold a recovering provider in `existingOnly`.
                          pattern: ^[1-9][0-9]*s$
                          type: string
                        successThreshold:
                          description: Consecutive healthy observations required to recover new admission.
                          format: uint32
                          maximum: 100.0
                          minimum: 1.0
                          type: integer
                      required:
                        - enterThreshold
                        - exitThreshold
                        - failureThreshold
                        - minimumStateDuration
                        - recoveryHoldDown
                        - successThreshold
                      type: object
                      x-kubernetes-validations:
                        - message: exitThreshold must be less than enterThreshold
                          rule: self.exitThreshold < self.enterThreshold
                  type: object
                budgetPolicy:
                  description: |-
                    Budget policy configuration for per-tenant spend tracking.

                    Selects which tenants Grid tracks cumulative spend for. See
                    [`BudgetPolicyConfig`] for what this does and does not do.

                    **Default (absent):** no tenants are tracked; `budgetStatus` is
                    always empty.
                  nullable: true
                  properties:
                    tenants:
                      default: []
                      description: Per-tenant budget caps.
                      items:
                        description: Per-tenant budget cap declaration.
                        properties:
                          capUsd:
                            description: |-
                              Maximum cumulative spend in USD before this tenant is considered over budget.

                              **Minimum value:** `0`. The generated CRD schema rejects negative caps;
                              [`validate_budget_policy`] additionally rejects `NaN`/infinite values
                              that the schema's numeric minimum does not catch.
                            format: double
                            minimum: 0.0
                            type: number
                          tenantId:
                            description: Tenant identifier. Must be non-empty and unique within the policy.
                            type: string
                        required:
                          - capUsd
                          - tenantId
                        type: object
                      type: array
                  type: object
                consumerGateways:
                  description: References to Praxis Gateways that participate in this grid.
                  items:
                    description: Reference to a Praxis Gateway that participates in this grid.
                    properties:
                      consumerConfig:
                        description: |-
                          Deprecated in favor of `praxisConfig`; this legacy field will be removed in a future release. Opt-in configuration for operator-managed consumer Praxis config generation.

                          When absent or `generate: false`, this gateway behaves exactly as before:
                          only the routing overlay `ConfigMap` is applied.  When `generate: true`, the
                          operator additionally renders a consumer Praxis `ConfigMap` containing the
                          routing filter `siteRouter` selects, `intelligent_route` or `grid_site_route`,
                          a `credential_inject` section for credential-bearing inference candidates, and a `load_balancer` section with
                          one cluster entry per unique inference cluster. Other capability kinds remain in the
                          routing overlay for dedicated data-plane pipelines.

                          The generated `ConfigMap` contains no token bytes. Credential-bearing
                          overlays are withheld until the consumer has explicitly declared that its
                          compatible filter config is already running.
                        nullable: true
                        properties:
                          clusterEndpoints:
                            default: []
                            description: |-
                              Endpoint topology for the generated `load_balancer` section.

                              Each entry maps an inference candidate cluster name to a reachable endpoint
                              address with explicit transport configuration. Every entry needs a
                              non-`None` `transport` field.

                              A candidate with no entry here, and none derived, is withdrawn from
                              this gateway.  Missing transport fails with `MissingTransport`.
                              Mutual-TLS transport without SNI fails with `MissingSni`.

                              In production, this is populated by whoever manages the consumer gateway
                              deployment (platform automation, the gateway operator, or a Helm chart).
                              In local Kind validation, the xtask harness discovers `NodePort` addresses
                              and populates this field in the test fixture.

                              Default: empty. Supply entries before enabling generated consumer config
                              for an overlay containing inference candidates.
                            items:
                              description: |-
                                Endpoint configuration for one consumer `load_balancer` cluster.

                                Maps an inference candidate cluster name to a reachable provider gateway
                                endpoint with explicit transport intent. Every cluster referenced by a
                                projected inference candidate must have a matching entry.

                                # Transport requirement

                                The `transport` field is required.  Missing transport fails closed
                                during config rendering with status reason `MissingTransport`.
                                Both TLS modes require nonblank `transport.sni`; otherwise rendering fails
                                with status reason `MissingSni`. `tls` can declare a custom CA Secret.
                              properties:
                                address:
                                  description: Reachable endpoint address (`host:port`).
                                  type: string
                                cluster:
                                  description: Cluster name - must match a projected inference `candidate.cluster` value.
                                  type: string
                                transport:
                                  description: |-
                                    Explicit transport configuration.

                                    Required.  Use `mutual_tls` with `sni` for remote/provider-gateway
                                    traffic.  Use `plaintext` only for local/dev-only endpoints.
                                    Missing transport fails closed during config rendering.
                                  nullable: true
                                  properties:
                                    caSecretRef:
                                      description: |-
                                        Optional gateway-namespace Secret supplying a custom CA bundle for `tls` transport.
                                        Specify only its name and optional key; the Secret must be in the namespace
                                        named by the containing `GatewayRef`. The mounted path is
                                        `/run/secrets/grid-backend-ca/{secret-name}/{key}`; the key defaults to
                                        `ca.crt`. Omitted uses the process trust store.
                                      nullable: true
                                      properties:
                                        key:
                                          description: Optional key containing the CA bundle. Defaults to `ca.crt`.
                                          minLength: 1
                                          nullable: true
                                          type: string
                                        name:
                                          description: Secret name in the target gateway namespace.
                                          minLength: 1
                                          type: string
                                      required:
                                        - name
                                      type: object
                                    mode:
                                      description: 'Transport mode: `mutual_tls`, `tls`, or explicit `plaintext`.'
                                      enum:
                                        - mutual_tls
                                        - tls
                                        - plaintext
                                      type: string
                                    sni:
                                      description: TLS Server Name Indication, required when mode is `mutual_tls` or `tls`.
                                      nullable: true
                                      type: string
                                  required:
                                    - mode
                                  type: object
                              required:
                                - address
                                - cluster
                              type: object
                            type: array
                          configMapName:
                            default: praxis-consumer-config
                            description: |-
                              Name of the generated consumer Praxis `ConfigMap`.

                              Default: `praxis-consumer-config`.
                            type: string
                          credentialMountBase:
                            description: |-
                              Deprecated in favor of `credentialMountPath`; this legacy field will be removed in a future release. Base directory for mounted credential Secret files inside the consumer pod.

                              In projected-credential mode, mount each Secret at
                              `{credentialMountPath}/{secret-namespace}/{secret-name}` with its data
                              keys as files. Static `file:` entries continue to use their explicit
                              paths and are not constrained by this directory layout.

                              Default: `/run/secrets/grid-credentials`.
                            type: string
                          credentialMountPath:
                            description: |-
                              Base directory for mounted credential Secret files inside the consumer pod.

                              In projected-credential mode, mount each Secret at
                              `{credentialMountPath}/{secret-namespace}/{secret-name}` with its data
                              keys as files. Static `file:` entries continue to use their explicit
                              paths and are not constrained by this directory layout.

                              Default: `/run/secrets/grid-credentials`.
                            type: string
                          deriveTopology:
                            description: |-
                              Derive the endpoint topology from the declarations of named providers,
                              instead of requiring a `clusterEndpoints` entry per candidate.
                            nullable: true
                            properties:
                              fromProviders:
                                default: []
                                description: |-
                                  Routing identities whose declarations this gateway derives from.

                                  Each entry is a provider's `clusterName`, or its `metadata.name`
                                  when that is unset. At most 64 entries, each named once.
                                items:
                                  maxLength: 253
                                  minLength: 1
                                  type: string
                                maxItems: 64
                                type: array
                                x-kubernetes-list-type: set
                              transport:
                                description: |-
                                  TLS for derived local `https` backends. Omitted uses the endpoint host and
                                  the process trust store.
                                nullable: true
                                properties:
                                  caSecretRef:
                                    description: |-
                                      Optional gateway-namespace Secret supplying a custom CA bundle for `tls` transport.
                                      Specify only its name and optional key; the Secret must be in the namespace
                                      named by the containing `GatewayRef`. The mounted path is
                                      `/run/secrets/grid-backend-ca/{secret-name}/{key}`; the key defaults to
                                      `ca.crt`. Omitted uses the process trust store.
                                    nullable: true
                                    properties:
                                      key:
                                        description: Optional key containing the CA bundle. Defaults to `ca.crt`.
                                        minLength: 1
                                        nullable: true
                                        type: string
                                      name:
                                        description: Secret name in the target gateway namespace.
                                        minLength: 1
                                        type: string
                                    required:
                                      - name
                                    type: object
                                  mode:
                                    description: 'Transport mode: `mutual_tls`, `tls`, or explicit `plaintext`.'
                                    enum:
                                      - mutual_tls
                                      - tls
                                      - plaintext
                                    type: string
                                  sni:
                                    description: TLS Server Name Indication, required when mode is `mutual_tls` or `tls`.
                                    nullable: true
                                    type: string
                                required:
                                  - mode
                                type: object
                            type: object
                          enableProjectedCredentials:
                            default: false
                            description: |-
                              Generate the dynamic `credential_inject` filter and projected mount
                              root, including when the current overlay has no credentials. Enable this
                              first, then roll out the generated config before asserting readiness
                              with `supportsProjectedCredentials`.

                              Default: `false`.
                            type: boolean
                          enabled:
                            description: |-
                              Deprecated in favor of `generate`; this legacy field will be removed in a future release. Enable operator-managed consumer Praxis config generation for this gateway.

                              Default: `false`.  Set to `true` to opt in.
                            type: boolean
                          generate:
                            description: |-
                              Enable operator-managed consumer Praxis config generation for this gateway.

                              Default: `false`.  Set to `true` to opt in.
                            type: boolean
                          listenerPort:
                            default: 8080
                            description: |-
                              HTTP port for the generated Praxis listener.

                              The rendered `listeners[0].address` is `0.0.0.0:{listenerPort}`.

                              Default: `8080`.
                            format: uint16
                            maximum: 65535.0
                            minimum: 0.0
                            type: integer
                          mountReconciliation:
                            description: |-
                              Opt in to validating Secret references and reconciling required mounts
                              into a specifically delegated gateway Deployment.

                              Disabled by default. When enabled, the named Deployment must carry the
                              `grid.praxis-proxy.io/mount-reconciliation`, `.../network`, and
                              `.../gateway` annotations emitted by `charts/praxis-gateway` (or set
                              them explicitly on an externally managed Deployment).
                            nullable: true
                            properties:
                              containerName:
                                default: praxis
                                description: Name of the Praxis container whose mounts Grid manages.
                                minLength: 1
                                type: string
                              deploymentName:
                                description: Name of the opted-in Deployment in the gateway namespace.
                                minLength: 1
                                nullable: true
                                type: string
                              enabled:
                                default: false
                                description: Enable delegated mount reconciliation. Defaults to `false`.
                                type: boolean
                            type: object
                          siteRouter:
                            default: intelligentRoute
                            description: |-
                              The filter that picks a candidate for each request.

                              `gridSiteRoute` reads the serving config, so it needs the operator's
                              poll signal transport. It also needs an enabled `mountReconciliation`,
                              whose rollout per config revision re-reads the provider-hop backends,
                              and an empty `providerHopEndpoints`, since hops follow `clusterEndpoints`.
                              Every cluster is health-checked, so the gateway's readiness probe must
                              ask Praxis `/healthy`: `/ready` fails while any one site is down.

                              Default: `intelligentRoute`.
                            enum:
                              - intelligentRoute
                              - gridSiteRoute
                            type: string
                          supportsProjectedCredentials:
                            default: false
                            description: |-
                              Declare that the running consumer has the dynamic `credential_inject`
                              filter configured with the projected Secret mount root. This is a
                              fail-closed capability gate for credential-bearing overlay revisions.
                              Set it only after the consumer has loaded a config containing that
                              filter; the Grid operator does not own or roll out the consumer
                              Deployment.

                              Default: `false`.
                            type: boolean
                          telemetry:
                            description: |-
                              Optional OpenTelemetry exporter and sampling settings for this gateway.

                              When present, the generated Praxis configuration opts into telemetry and
                              adds the `trace_context` filter for outbound W3C header propagation.
                              Collector authentication must be provided to the gateway Deployment via
                              `OTEL_EXPORTER_OTLP_HEADERS` from a Secret; credentials are never copied
                              into this `ConfigMap`.
                            nullable: true
                            properties:
                              batchIntervalSecs:
                                description: Batch exporter interval in seconds. Must be from 1 through 300 when set.
                                format: uint64
                                maximum: 300.0
                                minimum: 1.0
                                nullable: true
                                type: integer
                              batchSize:
                                description: Maximum spans per export batch. Must be from 1 through 65,536 when set.
                                format: uint
                                maximum: 65536.0
                                minimum: 1.0
                                nullable: true
                                type: integer
                              environment:
                                description: Deployment environment resource attribute.
                                nullable: true
                                pattern: ^.*\S.*$
                                type: string
                              otlpEndpoint:
                                description: |-
                                  OTLP collector endpoint, for example `http://otel-collector:4317`.

                                  If omitted, Praxis can read `OTEL_EXPORTER_OTLP_ENDPOINT` from the
                                  gateway Deployment. An empty string has the same meaning as omission.
                                nullable: true
                                pattern: ^(|https?://[^/?#@\s]+(:[0-9]+)?(/[^\s?#]*)?)$
                                type: string
                              samplingRate:
                                description: Root trace sampling probability from `0.0` through `1.0`.
                                format: double
                                maximum: 1.0
                                minimum: 0.0
                                nullable: true
                                type: number
                              serviceName:
                                description: OpenTelemetry `service.name` resource attribute.
                                nullable: true
                                pattern: ^.*\S.*$
                                type: string
                              serviceVersion:
                                description: OpenTelemetry `service.version` resource attribute.
                                nullable: true
                                pattern: ^.*\S.*$
                                type: string
                            type: object
                          tlsCertMountPath:
                            default: /etc/praxis/tls
                            description: |-
                              Mount path for TLS certificates inside the consumer pod.

                              Used when rendering mTLS cluster entries from `clusterEndpoints`.
                              The operator expects the consumer pod to mount a TLS Secret at this path,
                              containing `ca.crt`, `tls.crt`, and `tls.key`.

                              Default: `/etc/praxis/tls`.
                            type: string
                        type: object
                        x-kubernetes-validations:
                          - message: set only `enabled` or `generate`, not both
                            rule: '!(has(self.enabled) && has(self.generate))'
                          - message: set only `credentialMountBase` or `credentialMountPath`, not both
                            rule: '!(has(self.credentialMountBase) && has(self.credentialMountPath))'
                      localSiteName:
                        description: |-
                          Deprecated in favor of `siteName`; this legacy field will be removed in a future release. Local site name for the `intelligent_route` overlay generated for this gateway.

                          Identifies which [`GridSite`] this gateway's cluster represents.
                          Praxis uses `local_site` to score candidates running on the same site
                          higher than remote candidates.

                          When absent, the [`GridNetwork`] metadata name is used as a fallback.
                          This is correct for single-site networks where the network name and
                          site name are the same.  Multi-site networks should set this to the
                          [`GridSite`] name for the cluster hosting this gateway.

                          [`GridSite`]: crate::crd::grid_site::GridSite
                          [`GridNetwork`]: crate::crd::grid_network::GridNetwork
                        nullable: true
                        type: string
                      name:
                        description: Gateway name.
                        type: string
                      namespace:
                        description: Gateway namespace.
                        type: string
                      praxisConfig:
                        description: |-
                          Opt-in configuration for operator-managed consumer Praxis config generation.

                          When absent or `generate: false`, this gateway behaves exactly as before:
                          only the routing overlay `ConfigMap` is applied.  When `generate: true`, the
                          operator additionally renders a consumer Praxis `ConfigMap` containing the
                          routing filter `siteRouter` selects, `intelligent_route` or `grid_site_route`,
                          a `credential_inject` section for credential-bearing inference candidates, and a `load_balancer` section with
                          one cluster entry per unique inference cluster. Other capability kinds remain in the
                          routing overlay for dedicated data-plane pipelines.

                          The generated `ConfigMap` contains no token bytes. Credential-bearing
                          overlays are withheld until the consumer has explicitly declared that its
                          compatible filter config is already running.
                        nullable: true
                        properties:
                          clusterEndpoints:
                            default: []
                            description: |-
                              Endpoint topology for the generated `load_balancer` section.

                              Each entry maps an inference candidate cluster name to a reachable endpoint
                              address with explicit transport configuration. Every entry needs a
                              non-`None` `transport` field.

                              A candidate with no entry here, and none derived, is withdrawn from
                              this gateway.  Missing transport fails with `MissingTransport`.
                              Mutual-TLS transport without SNI fails with `MissingSni`.

                              In production, this is populated by whoever manages the consumer gateway
                              deployment (platform automation, the gateway operator, or a Helm chart).
                              In local Kind validation, the xtask harness discovers `NodePort` addresses
                              and populates this field in the test fixture.

                              Default: empty. Supply entries before enabling generated consumer config
                              for an overlay containing inference candidates.
                            items:
                              description: |-
                                Endpoint configuration for one consumer `load_balancer` cluster.

                                Maps an inference candidate cluster name to a reachable provider gateway
                                endpoint with explicit transport intent. Every cluster referenced by a
                                projected inference candidate must have a matching entry.

                                # Transport requirement

                                The `transport` field is required.  Missing transport fails closed
                                during config rendering with status reason `MissingTransport`.
                                Both TLS modes require nonblank `transport.sni`; otherwise rendering fails
                                with status reason `MissingSni`. `tls` can declare a custom CA Secret.
                              properties:
                                address:
                                  description: Reachable endpoint address (`host:port`).
                                  type: string
                                cluster:
                                  description: Cluster name - must match a projected inference `candidate.cluster` value.
                                  type: string
                                transport:
                                  description: |-
                                    Explicit transport configuration.

                                    Required.  Use `mutual_tls` with `sni` for remote/provider-gateway
                                    traffic.  Use `plaintext` only for local/dev-only endpoints.
                                    Missing transport fails closed during config rendering.
                                  nullable: true
                                  properties:
                                    caSecretRef:
                                      description: |-
                                        Optional gateway-namespace Secret supplying a custom CA bundle for `tls` transport.
                                        Specify only its name and optional key; the Secret must be in the namespace
                                        named by the containing `GatewayRef`. The mounted path is
                                        `/run/secrets/grid-backend-ca/{secret-name}/{key}`; the key defaults to
                                        `ca.crt`. Omitted uses the process trust store.
                                      nullable: true
                                      properties:
                                        key:
                                          description: Optional key containing the CA bundle. Defaults to `ca.crt`.
                                          minLength: 1
                                          nullable: true
                                          type: string
                                        name:
                                          description: Secret name in the target gateway namespace.
                                          minLength: 1
                                          type: string
                                      required:
                                        - name
                                      type: object
                                    mode:
                                      description: 'Transport mode: `mutual_tls`, `tls`, or explicit `plaintext`.'
                                      enum:
                                        - mutual_tls
                                        - tls
                                        - plaintext
                                      type: string
                                    sni:
                                      description: TLS Server Name Indication, required when mode is `mutual_tls` or `tls`.
                                      nullable: true
                                      type: string
                                  required:
                                    - mode
                                  type: object
                                  x-kubernetes-validations:
                                    - message: caSecretRef is only valid for tls transport
                                      rule: self.mode == 'tls' || !has(self.caSecretRef) || self.caSecretRef == null
                                    - message: an explicitly empty sni is only valid for plaintext transport
                                      rule: self.mode == 'plaintext' || !has(self.sni) || self.sni.size() > 0
                              required:
                                - address
                                - cluster
                              type: object
                            type: array
                          configMapName:
                            default: praxis-consumer-config
                            description: |-
                              Name of the generated consumer Praxis `ConfigMap`.

                              Default: `praxis-consumer-config`.
                            type: string
                          credentialMountBase:
                            description: |-
                              Deprecated in favor of `credentialMountPath`; this legacy field will be removed in a future release. Base directory for mounted credential Secret files inside the consumer pod.

                              In projected-credential mode, mount each Secret at
                              `{credentialMountPath}/{secret-namespace}/{secret-name}` with its data
                              keys as files. Static `file:` entries continue to use their explicit
                              paths and are not constrained by this directory layout.

                              Default: `/run/secrets/grid-credentials`.
                            type: string
                          credentialMountPath:
                            description: |-
                              Base directory for mounted credential Secret files inside the consumer pod.

                              In projected-credential mode, mount each Secret at
                              `{credentialMountPath}/{secret-namespace}/{secret-name}` with its data
                              keys as files. Static `file:` entries continue to use their explicit
                              paths and are not constrained by this directory layout.

                              Default: `/run/secrets/grid-credentials`.
                            type: string
                          deriveTopology:
                            description: |-
                              Derive the endpoint topology from the declarations of named providers,
