# Permissions ai-gateway-controller needs to primarily watch MaasTenantConfig
# (mirroring maas-controller's own TenantReconciler) and, per opted-in
# tenant, render+apply a per-tenant copy of the vendored praxis-extproc
# overlay (config/manifests/external-model/overlays/odh), which composes the
# pinned upstream praxis-extproc manifests with controller-owned patches.
# Verified against a live OpenShift cluster; every Kind here is one this
# controller actually creates/updates/deletes, no wildcard groups/resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-gateway-controller-role
rules:
# Primary watch target: MaasTenantConfig carries
# maas.opendatahub.io/payload-processing-type and
# maas.opendatahub.io/payload-processing-status (the payload-processing
# backend swap handshake with maas-controller — see pkg/tenant/migration.go),
# plus the aitenant-name/aitenant-namespace annotations used to resolve the
# owning AITenant. This controller writes metadata.finalizers
# (PraxisCleanupFinalizer) and the payload-processing-status annotation only,
# hence update/patch (and get/list/watch) here but no separate status
# subresource rule. patch is additionally required by the escalation check
# for the resourceVersion-checked status claim, which uses update.
- apiGroups: ["maas.opendatahub.io"]
  resources: ["maastenantconfigs"]
  verbs: ["get", "list", "watch", "update", "patch"]
# Secondary watch: resolve status.{phase,gatewayRef} for a MaasTenantConfig's
# owning AITenant (neither field lives on MaasTenantConfig itself), and react
# to AITenant changes that might affect readiness. This controller never
# writes AITenant (status or otherwise) — maas-controller's own AITenant
# reconciler owns it — hence get/list/watch only, no update/patch/finalizers.
- apiGroups: ["maas.opendatahub.io"]
  resources: ["aitenants"]
  verbs: ["get", "list", "watch"]
# Resources rendered from the vendored overlay, one set per praxis tenant.
- apiGroups: [""]
  resources: ["services", "serviceaccounts", "configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["networking.istio.io"]
  resources: ["envoyfilters", "destinationrules"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Manage the shared payload-processing-reader ClusterRole plus one
# payload-processing-reader-{tenantID} ClusterRoleBinding per tenant. Names
# are dynamic per tenant, so this can't be scoped down with resourceNames.
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterroles", "clusterrolebindings"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Escalation-check mirror: ai-gateway-controller must hold every permission it
# grants via payload-processing-reader.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
# Controller-owned credential copies (agc-cred-<hash12>) in tenant namespaces.
# The tenant ExtProc can mount Secrets only from its own namespace, so a
# credential Secret from elsewhere is copied there: server-side apply needs
# create and patch, and unreferenced copies are deleted. Trust boundary: the
# ClusterRoleBinding grants these verbs on every Secret in every namespace.
# RBAC cannot scope verbs by label, and hashed names rule out resourceNames,
# so the agc-cred- name and ownership labels are controller safeguards, not
# RBAC restrictions: the controller itself must only patch or delete Secrets
# carrying its ownership labels.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create", "patch", "delete"]
- apiGroups: ["maas.opendatahub.io"]
  resources: ["externalmodels"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["maas.opendatahub.io"]
  resources: ["externalmodels/finalizers"]
  verbs: ["update"]
- apiGroups: ["inference.opendatahub.io"]
  resources: ["externalproviders", "externalmodels"]
  verbs: ["get", "list", "watch", "create", "update"]
- apiGroups: ["inference.opendatahub.io"]
  resources: ["externalproviders", "externalmodels"]
  verbs: ["patch"]
- apiGroups: ["inference.opendatahub.io"]
  resources: ["externalproviders/status", "externalmodels/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["inference.opendatahub.io"]
  resources: ["externalproviders/finalizers", "externalmodels/finalizers"]
  verbs: ["update"]
# AIGuardrail is the guardrail reconciler's primary watch target. This
# controller owns AIGuardrail.status (the accepted provider binding:
# ResolvedRefs / ProviderReady / Accepted), hence the status subresource rule.
# It never writes the spec, so no update/patch on the resource itself, and it
# publishes status with a merge patch, so no update there either.
- apiGroups: ["aigateway.opendatahub.io"]
  resources: ["aiguardrails"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["aigateway.opendatahub.io"]
  resources: ["aiguardrails/status"]
  verbs: ["get", "patch"]
# Provider references: each AIGuardrail names a NemoGuardrails whose
# spec.allowedConsumers decides whether this namespace may consume it.
# TrustyAI's operator is the sole owner of NemoGuardrails and its status, so
# get/list/watch only — this controller reads the authorization input and
# never writes it.
- apiGroups: ["trustyai.opendatahub.io"]
  resources: ["nemoguardrails"]
  verbs: ["get", "list", "watch"]
# allowedConsumers Selector mode matches labels on the consuming namespace's
# Namespace object (never labels on the AIGuardrail), so those labels are an
# authorization input this controller must be able to read.
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["httproutes"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# A cross-namespace ExternalProvider reference must be authorized by a
# ReferenceGrant in the provider namespace. ExternalModel Gateway attachment
# uses HTTPRoute parent status, so no Namespace read is granted.
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["referencegrants"]
  verbs: ["get", "list", "watch"]
# The tenant reconciler checks that an AITenant's status.gatewayRef names an
# existing Gateway before applying praxis-extproc.
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gateways"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.istio.io"]
  resources: ["serviceentries"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# destinationrules already covered above (full CRUD, needed for the
# vendored overlay's own DestinationRule), so no separate mirror rule is
# needed here.
# Metrics endpoint authentication and authorization (FilterProvider).
# Required when --metrics-secure=true so the controller can validate
# bearer tokens and check RBAC for /metrics access.
- apiGroups: ["authentication.k8s.io"]
  resources: ["tokenreviews"]
  verbs: ["create"]
- apiGroups: ["authorization.k8s.io"]
  resources: ["subjectaccessreviews"]
  verbs: ["create"]
# Leader election (--leader-elect) and event recording.
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Two groups, because the manager has two recorders. Leader election emits
# through the deprecated core/v1 one (GetEventRecorderFor), while the
# AIGuardrail reconciler uses GetEventRecorder, whose sink is events.k8s.io/v1.
# Dropping either group silently 403s that half of the events.
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
# create and patch only: the events broadcaster never issues an update.
- apiGroups: ["events.k8s.io"]
  resources: ["events"]
  verbs: ["create", "patch"]
