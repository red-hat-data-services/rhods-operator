# Default namespace: opendatahub, matching maas-controller (this controller is
# deployed as its sibling — see DESIGN.md). Override via kustomize if needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway-controller
  namespace: opendatahub
  labels:
    control-plane: ai-gateway-controller
    app: ai-gateway-controller
spec:
  selector:
    matchLabels:
      control-plane: ai-gateway-controller
  replicas: 1
  template:
    metadata:
      labels:
        control-plane: ai-gateway-controller
        app: ai-gateway-controller
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - command:
        - /manager
        # Only flags whose value differs from this binary's own default belong
        # here. The operator vendors this manifest at a pinned commit but
        # resolves the image from a separate build, so any arg that restates a
        # default becomes a crash on upgrade whenever the image is older than
        # the manifest (RHAI-15815). --metrics-secure, --metrics-bind-address
        # and --health-probe-bind-address are therefore omitted deliberately —
        # do not re-add them.
        #
        # A build from this tree is unaffected: the probes below use 8081 and
        # the metrics Service/ServiceMonitor use 8443 over https with the cert
        # at /tmp/k8s-metrics-server/metrics-certs, which are exactly this
        # binary's defaults. An image older than 9030c29 has no --metrics-secure
        # flag at all and binds metrics on :8080 over plain http, so on that
        # pairing nothing answers on 8443 and scraping silently stops until the
        # image is rebuilt. That is the deliberate trade: no metrics beats no
        # control plane.
        args:
          - --leader-elect
          - --image=$(RELATED_IMAGE_ODH_PRAXIS_EXTPROC_IMAGE)
        env:
          - name: LOG_DEVELOPMENT
            value: "false"
          # Populated via configMapKeyRef (see config/self/default/kustomization.yaml
          # + params.env) so the installed praxis-extproc image is configurable
          # from ODH as a related image, matching maas-controller's
          # RELATED_IMAGE_* pattern for maas-api / payload-processing.
          - name: RELATED_IMAGE_ODH_PRAXIS_EXTPROC_IMAGE
            valueFrom:
              configMapKeyRef:
                key: praxis-extproc-image
                name: ai-gateway-controller-parameters
                optional: true
          # Consumer portal OIDC auth proxy image, supplied the same way.
          - name: RELATED_IMAGE_ODH_KUBE_AUTH_PROXY_IMAGE
            valueFrom:
              configMapKeyRef:
                key: kube-auth-proxy-image
                name: ai-gateway-controller-parameters
                optional: true
        image: ai-gateway-controller
        name: manager
        imagePullPolicy: Always
        ports:
        - containerPort: 8443
          name: metrics
          protocol: TCP
        - containerPort: 8081
          name: health
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts:
        - mountPath: /tmp/k8s-metrics-server/metrics-certs
          name: metrics-certs
          readOnly: true
      volumes:
      - name: metrics-certs
        secret:
          defaultMode: 420
          secretName: ai-gateway-controller-metrics-tls
      serviceAccountName: ai-gateway-controller
      terminationGracePeriodSeconds: 30
