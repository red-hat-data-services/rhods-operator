apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Only the CRDs this controller owns outright. The inference CRDs are shared
# with maas-controller, which installs them; a second installer would mean two
# copies of one cluster-scoped object, drifting apart.

resources:
  - bases/aigateway.opendatahub.io_aiguardrails.yaml