apiVersion: batch.llm-d.ai/v1alpha1
kind: LLMBatchGateway
metadata:
  name: batch-gateway-async
spec:
  secretRef:
    name: batch-gateway-secrets
  # if the secret is in a different namespace, create a ReferenceGrant in
  #  the secret's namespace (see the example below the LLMBatchGateway manifest)
  # secretRef:
  #   name: batch-gateway-secrets
  #   namespace: credentials-ns
  dbBackend: postgresql
  extraEndpoints:
  - /v1/classify
  fileStorage:
    s3:
      bucket: llm-d-batch-gateway
      region: us-east-1
      endpoint: https://s3.example.com
  apiServer:
    replicas: 1
    config:
      batchAPI:
        # Component-level override of spec.extraEndpoints.
        extraEndpoints:
        - /v1/classify
  processor:
    replicas: 1
    config:
      inputFileDiskBudgetPercent: 10
      progressUpdateInterval: 15s
      resumable:
        leaseDuration: 5m
        finalizeConcurrency: 16
        finalizeTimeout: 30m
      # Component-level override of spec.extraEndpoints.
      extraEndpoints:
      - /v1/classify
    modelGateways:
      llama-3:
        inferencePoolName: llama-pool
      whisper-large:
        inferencePoolName: whisper-pool
    asyncConfig:
      concurrency: 8
      drainTimeout: 2m
      resultPollTimeout: 30s
      inferenceGateway:
        url: http://epp.default.svc:8081
      redis:
        requestPathURL: /v1/completions
        pollIntervalMs: 1000
        batchSize: 10
        # One entry per processor.modelGateways entry, named
        # llm-d-async:requests:<inferencePoolName>. Without these the
        # async-processor polls its own default queue and never sees the
        # requests the processor enqueues.
        # Note: gateType/gateParams move here; setting them alongside
        # queuesConfig fails the chart render.
        queuesConfig:
        - name: "llm-d-async:requests:llama-pool"
          workerPoolID: default
          gateType: prometheus-saturation
          gateParams:
            prometheus_url: http://prometheus:9090
            saturation_threshold: "0.8"
        - name: "llm-d-async:requests:whisper-pool"
          workerPoolID: default
          gateType: prometheus-saturation
          gateParams:
            prometheus_url: http://prometheus:9090
            saturation_threshold: "0.8"
      workerPools:
      - name: default
        workers: 4
        gateType: redis-quota
        gateParams:
          quota_key: "dispatch-quota"
      prometheusURL: http://prometheus:9090
      prometheusCacheTTL: 30s
      # TLS for the async processor -> inference gateway connection. One
      # configuration covers every queue; there is no per-queue TLS.
      # Keys below are keys in the referenced Secret. secretName is required
      # whenever a cert key is set, and certKey/keyKey must be set together.
      # tls:
      #   secretName: igw-tls-certs
      #   caCertKey: ca.crt        # custom CA for verifying the gateway
      #   certKey: tls.crt         # mTLS client cert (needs keyKey)
      #   keyKey: tls.key          # mTLS client key (needs certKey)
      #   insecureSkipVerify: false  # not recommended in production
      # transformConfig:
      #   requestTransforms:
      #   - name: gcs-whisper
      #     type: gcs_uri_multipart
      #     parameters:
      #       providers: '["whisper","faster-whisper"]'
      # modelServerMonitor:
      #   enabled: true
      #   selector:
      #     llm-d.ai/role: decode
      #   port: modelserver
      #   path: /metrics
      #   interval: 15s
  gc:
    interval: 30m
---
# ReferenceGrant required for cross-namespace secretRef.
# Create this in the namespace where the Secret lives (credentials-ns),
# to allow LLMBatchGateway in "default" to reference the Secret named
# "batch-gateway-secrets". Remove the `name` field to allow any Secret.
#
# apiVersion: gateway.networking.k8s.io/v1beta1
# kind: ReferenceGrant
# metadata:
#   name: allow-batch-gateway-secret
#   namespace: credentials-ns
# spec:
#   from:
#   - group: batch.llm-d.ai
#     kind: LLMBatchGateway
#     namespace: default
#   to:
#   - group: ""
#     kind: Secret
#     name: batch-gateway-secrets
