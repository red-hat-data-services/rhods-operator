apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: controller-manager
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: mlflow-operator
  policyTypes:
    - Ingress
  ingress:
    # NetworkPolicies always allow traffic from a Pod's node, including kubelet
    # health probes: https://kubernetes.io/docs/concepts/services-networking/network-policies/
    # Permit metrics scraping only from the platform monitoring namespaces.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redhat-ods-monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opendatahub-monitoring
      ports:
        - protocol: TCP
          port: 8443
