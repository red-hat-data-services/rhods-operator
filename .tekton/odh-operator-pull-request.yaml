apiVersion: tekton.dev/v1
kind: PipelineRun
# konflux build manual retrigger - 2026-08-12 17:56:09
metadata:
  name: odh-operator-on-pull-request-{{pull_request_number}}
  labels:
    appstudio.openshift.io/application: rhoai-v3-7-ea-1
    appstudio.openshift.io/component: odh-operator-v3-7-ea-1
    pipelines.appstudio.openshift.io/type: build
  namespace: rhoai-tenant
  annotations:
    pipelinesascode.tekton.dev/on-comment: "^/build-konflux"
    build.appstudio.openshift.io/repo: "https://github.com/red-hat-data-services/rhods-operator?rev={{revision}}"
    build.appstudio.redhat.com/commit_sha: "{{revision}}"
    build.appstudio.redhat.com/target_branch: "{{target_branch}}"
    build.appstudio.redhat.com/pull_request_number: "{{pull_request_number}}"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "pull_request"
      && target_branch == "rhoai-3.7-ea.1"
      && konflux_cluster == "stone-prod-p02"
      && ( files.all.exists(p, !(
        p.matches('^bundle/') || p.matches('^build/') || p.matches('^\\.tekton/')
          || p.matches('^\\.github/workflows/')
          || p.matches('^Dockerfiles/bundle\\.Dockerfile$')
      ) || "build/operands-map.yaml".pathChanged() || ".tekton/odh-operator-pull-request.yaml".pathChanged()) )
spec:
  timeouts:
    pipeline: 4h
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/rhoai/odh-rhel9-operator:on-pr-{{pull_request_number}}
  - name: rhoai-version
    value: "3.7.0-ea.1"
  - name: dockerfile
    value: Dockerfiles/Dockerfile.konflux
  - name: path-context
    value: .
  - name: hermetic
    value: true
  - name: prefetch-input
    value: |
      [
        {
          "type": "gomod",
          "path": "."
        },
        {
          "type": "rpm",
          "path": "."
        }
      ]
  - name: build-source-image
    value: true
  - name: build-image-index
    value: true
  - name: build-platforms
    value:
    - linux/x86_64
    - linux/ppc64le
    - linux/s390x
    - linux-m2xlarge/arm64
  - name: image-expires-after
    value: 30d
  - name: enable-slack-failure-notification
    value: "false"
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/red-hat-data-services/konflux-central.git
    - name: revision
      value: 'rhoai-3.7-ea.1'
    - name: pathInRepo
      value: pipelines/multi-arch-container-build.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-operator-v3-7-ea-1
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
  taskRunSpecs:
  - pipelineTaskName: rpms-signature-scan
    stepSpecs:
    - name: rpms-signature-scan
      computeResources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "500m"
          memory: "1Gi"
status: {}
#restart
