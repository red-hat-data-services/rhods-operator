apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/red-hat-data-services/rhods-operator?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    # No build-nudge-files: this image is deleted with its branch. Block 2 takes
    # the digest from the gate's results.
    #
    # eg-* branches exist only during a gate run, so this is inert today.
    #
    # Two pushes land on one and only the second should build - the branch
    # creation, and the processor's commit. pathChanged() catches the normal
    # case (pinning rewrites operands-map.yaml; branch creation changes nothing);
    # event_title catches the --allow-empty no-op. The subject is set in
    # .github/workflows/operator-processor.yaml - change the two together.
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push"
      && target_branch.startsWith("eg-")
      && ("build/operands-map.yaml".pathChanged()
          || event_title.startsWith("early-gate:"))
  labels:
    appstudio.openshift.io/application: rhoai-early-gate
    appstudio.openshift.io/component: rhods-operator-eg
    pipelines.appstudio.openshift.io/type: build
  name: rhods-operator-eg-on-push
  namespace: rhoai-tenant
spec:
  # 4h, as the release push files - a 4-arch build that queues needs it, and the
  # gate's build-timeout-minutes outlasts it.
  timeouts:
    pipeline: 4h
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  # Must be a PUBLIC repo: the monitor resolves digests with quay's anonymous
  # token, which odh-rhel9-operator answers with 401. Component prefix because
  # the gate's three blocks share it.
  #
  # A fallback - the gate rewrites it on the ephemeral branch. Left templated so
  # a failed rewrite gives a unique tag the monitor misses, not a fixed one that
  # collides. Keep in step with image-tag on monitor-operator-build.
  - name: output-image
    value: quay.io/rhoai/pull-request-pipelines:odh-operator-{{target_branch}}-{{revision}}
  - name: image-expires-after
    value: 30d
  - name: dockerfile
    value: Dockerfiles/Dockerfile.konflux
  - name: path-context
    value: .
  - name: hermetic
    value: true
  - name: prefetch-input
    value: '[{"type": "gomod", "path": "."}, {"type": "rpm", "path": "."}]'
  - name: build-source-image
    value: true
  - name: build-image-index
    value: true
  # Full matrix, as odh-operator-pull-request.yaml. The POC built x86_64 only for
  # speed; a gate that builds one arch cannot stand in for a release build.
  - name: build-platforms
    value:
    - linux/x86_64
    - linux/ppc64le
    - linux/s390x
    - linux-m2xlarge/arm64
  # A failed gate build is a signal to the gate, not to the release team.
  - name: enable-slack-failure-notification
    value: "false"
  # No rhoai-version: konflux-central main does not declare it (rhoai-3.6 does),
  # and an eg-* branch always resolves main via the expression below.
  # skip-checks left at its default so all eight scanners run.
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/red-hat-data-services/konflux-central.git
    # As odh-operator-pull-request.yaml: a release branch resolves itself, else
    # main. The fallback is load-bearing - eg-* branches exist only here, so
    # '{{ target_branch }}' would not resolve and no build would start.
    - name: revision
      value: '{{ cel: pac.target_branch.matches("^rhoai-\\d+\\.\\d+(-ea\\.\\d+)?$") ? pac.target_branch : "main" }}'
    - name: pathInRepo
      value: pipelines/multi-arch-container-build.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-rhods-operator-eg
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
