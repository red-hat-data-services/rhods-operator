apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/red-hat-data-services/rhods-operator?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    # No build-nudge-files: this image is deleted with its branch, so a nudge PR
    # would point at nothing. Block 2 takes the digest from the gate's results.
    #
    # Fires only on an ephemeral eg-* branch, which exists only while a gate run
    # is in flight - so this file is inert on every branch that exists today.
    #
    # Two pushes land on such a branch and only the second should build: the one
    # that creates it, and the one operator-processor makes once it has pinned
    # the component digests. pathChanged() catches the normal case, since
    # pinning rewrites build/operands-map.yaml and a branch-creation push
    # reports no changed files. event_title catches the no-op case, where the
    # processor had nothing to write and committed --allow-empty. A
    # branch-creation push carries main's tip subject, which never starts with
    # "early-gate:". That prefix is set in .github/workflows/operator-processor.yaml
    # - the two have to change together.
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push"
      && target_branch.startsWith("eg-")
      && ("build/operands-map.yaml".pathChanged()
          || event_title.startsWith("early-gate:"))
  labels:
    appstudio.openshift.io/application: rhoai-early-gate
    appstudio.openshift.io/component: rhods-operator-eg
    pipelines.appstudio.openshift.io/type: build
  name: rhods-operator-eg-on-push
  namespace: rhoai-tenant
spec:
  # 4h, matching the release push files. A four-architecture build that queues
  # can legitimately exceed a shorter budget, and build-timeout-minutes in the
  # gate is set to outlast this.
  timeouts:
    pipeline: 4h
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  # Must be a PUBLIC repo: monitor-operator-build resolves the digest with
  # quay's anonymous token, which quay.io/rhoai/odh-rhel9-operator answers with
  # 401. Shared across the gate's three blocks, hence the component prefix.
  #
  # A fallback value - the gate rewrites it on the ephemeral branch to pin the
  # tag to odh-operator-eg-<leader-pr>. Left templated so a failed rewrite
  # yields a unique tag the monitor fails to find, rather than a fixed one that
  # collides between runs. Must stay in step with image-tag on
  # monitor-operator-build in konflux-central's early-gate pipeline.
  - name: output-image
    value: quay.io/rhoai/pull-request-pipelines:odh-operator-{{target_branch}}-{{revision}}
  - name: image-expires-after
    value: 30d
  - name: dockerfile
    value: Dockerfiles/Dockerfile.konflux
  - name: path-context
    value: .
  - name: hermetic
    value: true
  - name: prefetch-input
    value: '[{"type": "gomod", "path": "."}, {"type": "rpm", "path": "."}]'
  - name: build-source-image
    value: true
  - name: build-image-index
    value: true
  # The full matrix, as odh-operator-pull-request.yaml. The POC built x86_64
  # only for iteration speed; a gate that builds one architecture cannot stand
  # in for a release build.
  - name: build-platforms
    value:
    - linux/x86_64
    - linux/ppc64le
    - linux/s390x
    - linux-m2xlarge/arm64
  # A failed gate build is a signal to the gate, not to the release team.
  - name: enable-slack-failure-notification
    value: "false"
  # No rhoai-version and no skip-checks. multi-arch-container-build.yaml on
  # konflux-central main declares neither rhoai-version nor skip-fips-check, and
  # an eg-* branch always resolves main via the expression below. Leaving
  # skip-checks at its default keeps all eight scanners running, which is the
  # point of resolving the same pipeline the release build uses.
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/red-hat-data-services/konflux-central.git
    # Same expression as odh-operator-pull-request.yaml: a release branch
    # resolves itself, anything else falls back to main. That fallback is what
    # makes this work at all - the ephemeral eg-* branches exist only in this
    # repository and would never resolve in konflux-central, so a plain
    # '{{ target_branch }}' would fail to find the pipeline and no build would
    # start.
    - name: revision
      value: '{{ cel: pac.target_branch.matches("^rhoai-\\d+\\.\\d+(-ea\\.\\d+)?$") ? pac.target_branch : "main" }}'
    - name: pathInRepo
      value: pipelines/multi-arch-container-build.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-rhods-operator-eg
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
