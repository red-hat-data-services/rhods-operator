name: Diagnose insta-merge DNS

# Investigation only (RHAI-15286): no secrets or merge operations.
on:
  pull_request:
    paths:
      - '.github/scripts/diagnose-insta-merge-dns.sh'
      - '.github/scripts/tests/test-diagnose-insta-merge-dns.sh'
      - '.github/workflows/diagnose-insta-merge-dns.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Compare host and container DNS with both CLI architectures
        shell: bash
        run: |
          mkdir -p diagnostic-logs
          sh .github/scripts/diagnose-insta-merge-dns.sh 2>&1 | tee diagnostic-logs/probe.log
      - name: Preserve diagnostic output even if a probe fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: insta-merge-dns-${{ matrix.runner }}
          path: diagnostic-logs/
          retention-days: 7
          if-no-files-found: warn
