# =============================================================================
# EARLY-GATE OVERLAY of red-hat-data-services/rhods-operator
#   .github/workflows/operator-processor.yaml
#
# The early-gate build pipeline copies this file onto the ephemeral operator
# branch (.github/workflows/operator-processor.yaml) before dispatching, when
# the pipeline param `eg-overlay-operator-processor` is "true". Because the gate
# dispatches with ref=<eg-branch>, GitHub runs THIS version - so the snapshot-
# pinning behaviour is exercised without changing rhods-operator@main or
# RHOAI-Konflux-Automation@main.
#
# Differences from the upstream workflow (keep in sync otherwise):
#   1. the `utils` (RHOAI-Konflux-Automation) checkout ref -> eg-snapshot-pinning
#   2. the Execute step passes --snapshot-path build/eg-snapshot.json in EG mode
#
# Once both changes merge to their respective main branches, set
# `eg-overlay-operator-processor` to "false"; the gate then stops overlaying and
# the ephemeral branch's own (forked-from-main) workflow runs instead. This file
# can then be deleted.
# =============================================================================
name: Operator Processor

on:
  workflow_dispatch:
    inputs:
      eg-mode:
        description: 'Run in early-gate mode'
        required: false
        default: 'false'
        type: string
      eg-branch:
        description: 'Ephemeral branch name for EG'
        required: false
        default: ''
        type: string
      leader-pr-number:
        description: 'Leader PR number for EG correlation'
        required: false
        default: ''
        type: string
      rhoai-version:
        description: 'RHOAI version for EG'
        required: false
        default: ''
        type: string
  push:
    branches:
      - 'rhoai-[23].[0-9]'  # e.g. rhoai-2.1, rhoai-3.1, rhoai-3.4
      - 'rhoai-[23].[0-9][0-9]'  # e.g. rhoai-2.10, rhoai-3.10, rhoai-3.22
      - 'rhoai-[23].[0-9]-ea.[0-9]'  # e.g. rhoai-2.4-ea.1, rhoai-3.4-ea.1, rhoai-3.5-ea.2
      - 'rhoai-[23].[0-9][0-9]-ea.[0-9]'  # e.g. rhoai-2.10-ea.1, rhoai-3.10-ea.3
    paths:
      - build/operator-nudging.yaml


env:
  GITHUB_ORG: red-hat-data-services
  LOG_FILE_DIR: ${{ github.workspace }}
  LOG_FILE_NAME: operator-processor.log

permissions:
  contents: write

jobs:
  operator-processor:
    if: ${{ github.ref_name != 'main' && (github.event_name == 'workflow_dispatch' || ( github.event_name == 'push' && github.event.commits[0].author.name == 'konflux-internal-p02[bot]' )) }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RHOAI_DEVOPS_CLIENT_ID }}
          private-key: ${{ secrets.RHOAI_DEVOPS_APP_PRIVATE_KEY }}
          owner: red-hat-data-services
          repositories: rhods-operator

      # Resolve the release identity separately from the branch being processed.
      # In EG mode, artifacts come from the ephemeral operator branch while the
      # release version still selects the RBC bundle and component manifests.
      - name: Configure workflow parameters
        id: config
        env:
          EG_MODE: ${{ inputs.eg-mode }}
          EG_BRANCH: ${{ inputs.eg-branch }}
          RHOAI_VERSION: ${{ inputs.rhoai-version }}
        run: |
          set -euo pipefail

          if [[ "$EG_MODE" == "true" ]]; then
            if [[ -z "$EG_BRANCH" ]]; then
              echo "::error::eg-mode is true but eg-branch is empty."
              exit 1
            fi
            # Keep EA identity when reducing an explicit build version to a branch.
            VERSION="${RHOAI_VERSION#rhoai-}"
            if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)(\.[0-9]+)?(-ea\.([0-9]+))?$ ]]; then
              echo "::error::Invalid EG rhoai-version '${RHOAI_VERSION}'; expected X.Y[.Z][-ea.N]."
              exit 1
            fi
            MAJOR_MINOR="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}${BASH_REMATCH[4]}"
            BRANCH="$EG_BRANCH"
            RELEASE_BRANCH="rhoai-${MAJOR_MINOR}"
            RBC_REF="rhoai-${MAJOR_MINOR}"
            OPERATOR_REF="$EG_BRANCH"
          else
            BRANCH="${GITHUB_REF_NAME}"
            RELEASE_BRANCH="$BRANCH"
            RBC_REF="$BRANCH"
            OPERATOR_REF="$BRANCH"
          fi

          {
            echo "branch=${BRANCH}"
            echo "release_branch=${RELEASE_BRANCH}"
            echo "rbc_ref=${RBC_REF}"
            echo "operator_ref=${OPERATOR_REF}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout RBC repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ env.GITHUB_ORG }}/RHOAI-Build-Config
          ref: ${{ steps.config.outputs.rbc_ref }}
          path: RBC
          token: ${{ steps.app-token.outputs.token }}
          sparse-checkout: |
            bundle/bundle-patch.yaml
          sparse-checkout-cone-mode: false
      - name: Git checkout utils
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ env.GITHUB_ORG }}/RHOAI-Konflux-Automation
          # early-gate overlay: the snapshot-pinning logic lives on this branch
          # until it merges to main. When it does, revert this to 'main' (and set
          # eg-overlay-operator-processor=false so this overlay stops being applied).
          ref: eg-snapshot-pinning
          path: utils
          token: ${{ steps.app-token.outputs.token }}
          sparse-checkout: |
            utils/processors
          sparse-checkout-cone-mode: false
      - name: Git checkout operator repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ env.GITHUB_ORG }}/rhods-operator
          ref: ${{ steps.config.outputs.operator_ref }}
          path: rhods-operator
          token: ${{ steps.app-token.outputs.token }}
          sparse-checkout: |
            build
            prefetched-manifests
            prefetched-charts
            .tekton
          sparse-checkout-cone-mode: false
      - name: Install dependencies
        run: |
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/')"
          yq_version="v4.44.3"
          yq_filename="yq-$yq_version"
          echo "-> Downloading yq" >&2
          curl -sSfLo "$yq_filename" "https://github.com/mikefarah/yq/releases/download/$yq_version/yq_${os}_${arch}"
          chmod +x $yq_filename
          ln -s $yq_filename yq
          cp $yq_filename /usr/local/bin/yq
  
          pip install --default-timeout=100 -r utils/utils/processors/requirements.txt

      - name: Execute Operator Processor
        env:
          BRANCH: ${{ steps.config.outputs.release_branch }}
          EG_MODE: ${{ inputs.eg-mode }}
          RHOAI_QUAY_API_TOKEN: ${{ secrets.RHOAI_QUAY_API_TOKEN }}
        run: |
          RHOAI_VERSION=v${BRANCH/rhoai-/}
          COMPONENT_SUFFIX=${RHOAI_VERSION//./-}
          ODH_OPERATOR_COMPONENT_NAME=odh-operator-${COMPONENT_SUFFIX}
          PUSH_PIPELINE_PATH=rhods-operator/.tekton/${ODH_OPERATOR_COMPONENT_NAME}-push.yaml
          # main/stable carry the EG PipelineRun, not a release-versioned one.
          if [[ "${EG_MODE}" == "true" ]]; then
            PUSH_PIPELINE_PATH=rhods-operator/.tekton/rhods-operator-eg-push.yaml
          fi
          
          PATCH_YAML_PATH=RBC/bundle/bundle-patch.yaml
          OPERANDS_MAP_PATH=rhods-operator/build/operands-map.yaml
          NUDGING_YAML_PATH=rhods-operator/build/operator-nudging.yaml
          MANIFEST_CONFIG_PATH=rhods-operator/build/manifests-config.yaml

          # early-gate overlay: in EG mode the gate commits the group snapshot to
          # the ephemeral branch so the operator is pinned to the PR builds under
          # test (release fallback for components absent from the snapshot). The
          # file is required in EG mode - its absence means the gate did not stage
          # it, which would silently build released operands.
          SNAPSHOT_ARG=""
          if [[ "${EG_MODE}" == "true" ]]; then
            EG_SNAPSHOT_PATH=rhods-operator/build/eg-snapshot.json
            if [[ -f "${EG_SNAPSHOT_PATH}" ]]; then
              SNAPSHOT_ARG="--snapshot-path ${EG_SNAPSHOT_PATH}"
              echo "early-gate: pinning operands from ${EG_SNAPSHOT_PATH}"
            else
              echo "::error::eg-mode is true but ${EG_SNAPSHOT_PATH} is missing; the gate must commit the group snapshot before dispatch."
              exit 1
            fi
          fi

          python3 utils/utils/processors/operator-processor.py  -op process-operator-yamls --patch-yaml-path ${PATCH_YAML_PATH} --operands-map-path ${OPERANDS_MAP_PATH} --nudging-yaml-path ${NUDGING_YAML_PATH} --manifest-config-path ${MANIFEST_CONFIG_PATH} --rhoai-version ${BRANCH} --push-pipeline-yaml-path ${PUSH_PIPELINE_PATH} --push-pipeline-operation enable ${SNAPSHOT_ARG}
          
      - name: Print debug logs
        if: always()
        run: |
          LOG_FILE="${{ env.LOG_FILE_DIR }}/${{ env.LOG_FILE_NAME }}"
          if [ -f "$LOG_FILE" ]; then
            cat "$LOG_FILE"
          else
            echo "Log file not found at $LOG_FILE"
          fi

      - name: Fetch all manifests
        env:
          BRANCH: ${{ steps.config.outputs.release_branch }}
        run: |
          #!/bin/bash
          set -e
          echo "current dir = $(pwd)"
          MANIFEST_CONFIG_PATH=${{ github.workspace }}/rhods-operator/build/manifests-config.yaml
          PREFETCHED_MANIFEST_DIR_PATH="rhods-operator/prefetched-manifests"
          PREFETCHED_CHARTS_DIR_PATH="rhods-operator/prefetched-charts"

          # Clean up old prefetched manifests and charts
          if [ -d "$PREFETCHED_MANIFEST_DIR_PATH" ]; then
              echo "Cleaning up old prefetched manifests..."
              rm -rf "$PREFETCHED_MANIFEST_DIR_PATH"
          fi
          if [ -d "$PREFETCHED_CHARTS_DIR_PATH" ]; then
              echo "Cleaning up old prefetched charts..."
              rm -rf "$PREFETCHED_CHARTS_DIR_PATH"
          fi

          # Create fresh directories
          mkdir -p "$PREFETCHED_MANIFEST_DIR_PATH"
          mkdir -p "$PREFETCHED_CHARTS_DIR_PATH"
          mkdir -p manifests
          cd manifests
          while IFS= read -r value;
          do
              value=${value/- /}
              component=$value

              # Skip empty keys
              [[ -z "$component" ]] && continue
               
              echo "=============================================================="
              echo "Fetching Manifest for component: $component"
              echo "=============================================================="
              if [[ -n $component ]]
              then	
                  git_url=$(value="$value" yq '.map[strenv(value)]["git.url"]' ${MANIFEST_CONFIG_PATH})
                  git_commit=$(value="$value" yq '.map[strenv(value)]["git.commit"]' ${MANIFEST_CONFIG_PATH})
                  ref_type=$(value="$value" yq '.map[strenv(value)]["ref_type"]' ${MANIFEST_CONFIG_PATH})

                  # If ref_type is branch, resolve the actual commit SHA
                  if [[ "$ref_type" == "branch" ]]; then
                    # Fetch latest commit SHA for the branch from remote
                    git_commit=$(git ls-remote "$git_url" "refs/heads/$BRANCH" | awk '{print $1}')
                    echo "Resolved git.commit for branch '$BRANCH' to commit SHA $git_commit"

                    # Update the git.commit field in manifests-config.yaml for the current component.
                    # Using strenv() to safely reference both the component key ($value) and the new commit SHA ($git_commit).
                    # This avoids issues with --arg, which is not supported in this yq version, and prevents creating an empty "" key.
                    value="$value" git_commit="$git_commit" yq -i eval '.map[strenv(value)]["git.commit"] = strenv(git_commit)' ${MANIFEST_CONFIG_PATH}

                  fi

                  src=$(value="$value" yq '.map[strenv(value)]["src"]' ${MANIFEST_CONFIG_PATH})
                  dest=$(value="$value" yq '.map[strenv(value)]["dest"]' ${MANIFEST_CONFIG_PATH})
                  entry_type=$(value="$value" yq '.map[strenv(value)]["type"] // "manifest"' ${MANIFEST_CONFIG_PATH})

                  # Route to the correct output directory based on type
                  if [[ "$entry_type" == "chart" ]]; then
                    PREFETCHED_DIR_PATH="${PREFETCHED_CHARTS_DIR_PATH}"
                  else
                    PREFETCHED_DIR_PATH="${PREFETCHED_MANIFEST_DIR_PATH}"
                  fi

                  echo "component = $component"
                  echo "git_url = $git_url"
                  echo "git_commit = $git_commit"
                  echo "src = $src"
                  echo "dest = $dest"
                  echo "type = $entry_type"

                  mkdir -p $component
                  cd $component

                  git config --global init.defaultBranch ${BRANCH}
                  git init
                  git remote add origin $git_url
                  git config core.sparseCheckout true
                  git config core.sparseCheckoutCone false
                  echo "$src" >> .git/info/sparse-checkout
                  git fetch --depth=1 origin $git_commit
                  git checkout $git_commit

                  cd ../
                  echo "current dir = $(pwd)"

                  dest_dir_path=${{ github.workspace }}/${PREFETCHED_DIR_PATH}/$dest
                  mkdir -p ${dest_dir_path}

                  cp -r $component/$src/* ${dest_dir_path}
                  echo ""
              fi
          done < <(yq e '.map | keys' ${MANIFEST_CONFIG_PATH} )
          
          echo "=== Prefetched Manifests ==="
          cd ${{ github.workspace }}/${PREFETCHED_MANIFEST_DIR_PATH}
          tree
          echo "=== Prefetched Charts ==="
          cd ${{ github.workspace }}/${PREFETCHED_CHARTS_DIR_PATH}
          tree

      - name: Fetch all charts
        env:
          BRANCH: ${{ steps.config.outputs.release_branch }}
        run: |
          #!/bin/bash
          set -e
          echo "current dir = $(pwd)"
          CHARTS_CONFIG_PATH=${{ github.workspace }}/rhods-operator/build/charts-config.yaml
          PREFETCHED_CHARTS_DIR_PATH="rhods-operator/prefetched-charts"

          # Create directory if not already created by the manifests step
          mkdir -p "$PREFETCHED_CHARTS_DIR_PATH"
          mkdir -p charts
          cd charts
          while IFS= read -r value;
          do
              value=${value/- /}
              component=$value

              # Skip empty keys
              [[ -z "$component" ]] && continue
               
              echo "=============================================================="
              echo "Fetching Chart for component: $component"
              echo "=============================================================="
              if [[ -n $component ]]
              then	
                  git_url=$(value="$value" yq '.map[strenv(value)]["git.url"]' ${CHARTS_CONFIG_PATH})
                  git_commit=$(value="$value" yq '.map[strenv(value)]["git.commit"]' ${CHARTS_CONFIG_PATH})
                  ref_type=$(value="$value" yq '.map[strenv(value)]["ref_type"]' ${CHARTS_CONFIG_PATH})

                  if [[ "$ref_type" == "branch" ]]; then
                    git_commit=$(git ls-remote "$git_url" "refs/heads/$BRANCH" | awk '{print $1}')
                    if [[ -z "$git_commit" ]]; then
                      echo "::error::Could not resolve chart branch '$BRANCH' in $git_url."
                      exit 1
                    fi
                    echo "Resolved git.commit for branch '$BRANCH' to commit SHA $git_commit"

                    value="$value" git_commit="$git_commit" yq -i eval '.map[strenv(value)]["git.commit"] = strenv(git_commit)' ${CHARTS_CONFIG_PATH}
                  fi

                  src=$(value="$value" yq '.map[strenv(value)]["src"]' ${CHARTS_CONFIG_PATH})
                  dest=$(value="$value" yq '.map[strenv(value)]["dest"]' ${CHARTS_CONFIG_PATH})
                  
                  echo "component = $component"
                  echo "git_url = $git_url"
                  echo "git_commit = $git_commit"
                  echo "src = $src"
                  echo "dest = $dest"
          
                  mkdir -p $component
                  cd $component
          
                  git config --global init.defaultBranch ${BRANCH}
                  git init
                  git remote add origin $git_url
                  git config core.sparseCheckout true
                  git config core.sparseCheckoutCone false
                  echo "$src" >> .git/info/sparse-checkout
                  git fetch --depth=1 origin $git_commit
                  git checkout $git_commit
          
                  cd ../
                  echo "current dir = $(pwd)"
                  
                  dest_dir_path=${{ github.workspace }}/${PREFETCHED_CHARTS_DIR_PATH}/$dest
                  mkdir -p ${dest_dir_path}

                  cp -r $component/$src/* ${dest_dir_path}
                  echo ""
              fi
          done < <(yq e '.map | keys' ${CHARTS_CONFIG_PATH} )
          
          cd ${{ github.workspace }}/${PREFETCHED_CHARTS_DIR_PATH}
          tree

      - name: Commit and push the changes to release branch
        working-directory: rhods-operator
        env:
          EG_MODE: ${{ inputs.eg-mode }}
          TARGET_REF: ${{ steps.config.outputs.operator_ref }}
        run: |
          set -euo pipefail
          git config user.name "Openshift-AI DevOps"
          git config user.email "openshift-ai-devops@redhat.com"
          git add -A
          if [[ "$EG_MODE" == "true" ]]; then
            git commit --allow-empty -m "early-gate: pin component digests for ${TARGET_REF}"
            git push origin "HEAD:${TARGET_REF}"
          else
            git diff --staged --quiet || (git commit -m "Updating the operator repo with latest images and manifests" && git push origin "HEAD:${TARGET_REF}")
          fi

      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-processor-output
          path: ${{ env.LOG_FILE_DIR }}/${{ env.LOG_FILE_NAME }}
          if-no-files-found: warn
          retention-days: 30
