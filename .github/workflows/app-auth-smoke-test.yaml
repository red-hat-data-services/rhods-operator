name: App Authentication Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RHOAI_DEVOPS_CLIENT_ID }}
          private-key: ${{ secrets.RHOAI_DEVOPS_APP_PRIVATE_KEY }}
          owner: red-hat-data-services
          repositories: rhods-operator

      - name: Checkout with App token
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Verify authenticated App actor
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EXPECTED_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          actual="$(gh api user --jq .login)"
          expected="${EXPECTED_APP_SLUG}[bot]"
          test "$actual" = "$expected"
          echo "Authenticated as $actual"
