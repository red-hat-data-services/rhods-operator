name: Bundle Sync CI

on:
  workflow_dispatch:

  push:
    branches:
      - 'rhoai-[23].[0-9]'  # e.g. rhoai-2.1, rhoai-3.1, rhoai-3.4
      - 'rhoai-[23].[0-9][0-9]'  # e.g. rhoai-2.10, rhoai-3.10, rhoai-3.22
      - 'rhoai-[3].[0-9]-ea.[0-9]'  # e.g. rhoai-3.4-ea.1, rhoai-3.5-ea.2
      - 'rhoai-[3].[0-9][0-9]-ea.[0-9]'  # e.g. rhoai-3.10-ea.3

permissions:
  contents: read
  packages: write
  id-token: write

env:
  GITHUB_ORG: red-hat-data-services
  GITHUB_RKA_ORG: rhoai-rhtap

jobs:
  sync:
    if: ${{ github.ref_name != 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate github-app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RHOAI_DEVOPS_CLIENT_ID }}
          private-key: ${{ secrets.RHOAI_DEVOPS_APP_PRIVATE_KEY }}
          owner: red-hat-data-services
          repositories: rhods-operator,RHOAI-Build-Config
      - name: Checkout source repo
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          repository: ${{ env.GITHUB_ORG }}/rhods-operator
          path: source_repo
          ref: ${{ github.ref_name }}  # Use the same branch name as in the event
          token: ${{ steps.app-token.outputs.token }}

      - name: Checkout target repo
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          repository: ${{ env.GITHUB_ORG }}/RHOAI-Build-Config
          path: target_repo
          ref: ${{ github.ref_name }}  # Use the same branch name as in the event
          token: ${{ steps.app-token.outputs.token }}
          # Full history so the push step can rebase onto the branch tip when a
          # concurrent writer lands mid-run.
          fetch-depth: 0

      - name: Generate bundle files
        run: |
          cd source_repo
          ODH_PLATFORM_TYPE=rhoai make bundle

      - name: Sync Bundle Files
        run: |
          mkdir -p target_repo/to-be-processed/bundle
          echo "Updating bundle related files"
          rm -rf target_repo/to-be-processed/bundle/*
          if [ -d source_repo/rhoai-bundle ]; then
            cp -r source_repo/rhoai-bundle/* target_repo/to-be-processed/bundle
          else
            cp -r source_repo/bundle/* target_repo/to-be-processed/bundle
          fi
          sed -i -e "s|image: quay.io/opendatahub/opendatahub-operator:latest.*|image: REPLACE_IMAGE:latest|g" target_repo/to-be-processed/bundle/manifests/rhods-operator.clusterserviceversion.yaml
#          echo "Updating Dockerfile"
#          cp source_repo/Dockerfiles/bundle.Dockerfile target_repo/to-be-processed/bundle/Dockerfile

      - name: Check for bundle changes
        id: bundle-change-check
        run: |
          cd target_repo
          git add to-be-processed/bundle
          if [ -z "$(git diff --staged | grep -P '^[-+]' | grep -v createdAt | grep -v -P '^(\+\+\+|---)')" ]; then
            echo "bundle_changes=empty" >> $GITHUB_OUTPUT
          else
            echo "bundle_changes=present" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push the changes to release branch
        if: ${{ steps.bundle-change-check.outputs.bundle_changes == 'present' }}
        working-directory: target_repo
        env:
          TARGET_REF: ${{ github.ref_name }}
          PUSH_RETRIES: '5'
        run: |
          set -euo pipefail
          git config user.name "Openshift-AI DevOps"
          git config user.email "openshift-ai-devops@redhat.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Sync changes from source repo"

          # RHOAI-Build-Config has several concurrent writers, so a plain push
          # fails with a non-fast-forward whenever another one lands while this
          # job is generating the bundle. Rebase onto the new tip and retry;
          # "-X theirs" keeps this job's freshly generated bundle on conflicting
          # hunks, which is correct because it is regenerated wholesale from the
          # source repo.
          for attempt in $(seq 1 "${PUSH_RETRIES}"); do
            if git push origin "HEAD:${TARGET_REF}"; then
              echo "Pushed to ${TARGET_REF} on attempt ${attempt}"
              exit 0
            fi
            echo "Push rejected, rebasing onto origin/${TARGET_REF} (attempt ${attempt}/${PUSH_RETRIES})"
            git fetch origin "${TARGET_REF}"
            if ! git rebase -X theirs "origin/${TARGET_REF}"; then
              git rebase --abort || true
              echo "::error::Could not rebase onto origin/${TARGET_REF}"
              exit 1
            fi
            sleep $(( attempt * 5 ))
          done
          echo "::error::Failed to push to ${TARGET_REF} after ${PUSH_RETRIES} attempts"
          exit 1
