config: {}
fullnameOverride: ""
imagePullSecrets: []
monitoring:
  serviceMonitor:
    collector:
      serviceAccount:
        name: data-science-collector-collector
        namespace: opendatahub
    enabled: true
nameOverride: ""
openshift:
  securityContextConstraints: false
  serviceCA: false
operator:
  image:
    pullPolicy: Always
    ref: quay.io/opendatahub/opendatahub-db-operator:latest
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 10m
      memory: 128Mi
platform:
  type: OpenDataHub
  version: ""
serviceAccount:
  annotations: {}
  name: ""
