apiVersion: v1
data:
  platformType: {{ default "OpenDataHub" .Values.platform.type | quote }}
  platformVersion: {{ default "" .Values.platform.version | quote }}
  {{- range $key, $val := .Values.config }}
  {{- if and (ne $key "platformType") (ne $key "platformVersion") }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- end }}
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: opendatahub-db-operator
  name: odh-databaseservice-config
  namespace: {{ .Release.Namespace }}
---
{{- if or .Values.openshift.serviceCA (.Capabilities.APIVersions.Has "security.openshift.io/v1") }}
apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
  labels:
    app.kubernetes.io/name: opendatahub-db-operator
  name: odh-db-operator-metrics-server-ca
  namespace: {{ .Release.Namespace }}
{{- end }}