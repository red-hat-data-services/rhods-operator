apiVersion: v1
kind: Service
metadata:
  annotations:
    {{- if or .Values.openshift.serviceCA (.Capabilities.APIVersions.Has "security.openshift.io/v1") }}
    service.beta.openshift.io/serving-cert-secret-name: metrics-server-cert
    {{- end }}
  labels:
    app.kubernetes.io/name: opendatahub-db-operator
  name: odh-db-operator-metrics-service
  namespace: {{ .Release.Namespace }}
spec:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: 8443
  selector:
    app.kubernetes.io/name: opendatahub-db-operator
---
apiVersion: v1
kind: Service
metadata:
  name: odh-db-operator-webhook-service
  namespace: {{ .Release.Namespace }}
spec:
  ports:
  - port: 443
    protocol: TCP
    targetPort: webhook-server
  selector:
    app.kubernetes.io/name: opendatahub-db-operator