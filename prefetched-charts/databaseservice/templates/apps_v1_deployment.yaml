apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: opendatahub-db-operator
  name: odh-db-operator-operator
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: opendatahub-db-operator
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/core_v1_configmap.yaml") . | sha256sum }}
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: opendatahub-db-operator
    spec:
      containers:
      - command:
        - /manager
        - operator
        env:
        - name: ODH_MODULE_OPERATOR_CONFIGURATION_PATH
          value: /etc/controller/config
        - name: ODH_MODULE_OPERATOR_OPERATOR_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: ODH_MODULE_OPERATOR_CONTROLLER_METRICS_BIND_ADDRESS
          value: :8443
        image: "{{ include "chart.imageRef" . }}"
        imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.operator.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /etc/controller/config
          name: config
          readOnly: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: {{ default (include "chart.fullname" .) .Values.serviceAccount.name }}
      terminationGracePeriodSeconds: 10
      volumes:
      - configMap:
          name: odh-databaseservice-config
        name: config