apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: odh-db-operator-serving-cert
  namespace: {{ .Release.Namespace }}
spec:
  dnsNames:
  - odh-db-operator-webhook-service.{{ .Release.Namespace }}.svc
  - odh-db-operator-webhook-service.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: odh-db-operator-selfsigned-issuer
  secretName: webhook-server-cert