{{- if .Values.upgradeGates }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: feastoperator-upgrade-gates
  namespace: {{ default .Release.Namespace .Values.namespace }}
  labels:
    platform.opendatahub.io/upgrade-gate: "true"
data:
  {{- range $key, $val := .Values.upgradeGates }}
  {{ $key | quote }}: {{ $val | quote }}
  {{- end }}
{{- end }}
