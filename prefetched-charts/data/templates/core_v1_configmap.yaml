apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: opendatahub-feast-operator
  name: odh-data-config
  namespace: {{ default .Release.Namespace .Values.namespace }}
{{- if or .Values.imagePullSecret .Values.config }}
data:
  {{- with .Values.imagePullSecret }}
  imagePullSecret: {{ . }}
  {{- end }}
  {{- range $key, $val := .Values.config }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}