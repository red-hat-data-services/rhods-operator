                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: RaySpec defines the desired state of the Ray module.
              properties:
                applicationsNamespace:
                  description: |-
                    ApplicationsNamespace is the namespace where the module operator deploys
                    operand resources. Projected by the platform operator; immutable once set.
                  type: string
                managementState:
                  default: Managed
                  description: |-
                    ManagementState controls whether the operator actively manages the
                    component (Managed) or removes it (Removed).
                  enum:
                    - Managed
                    - Removed
                  type: string
              type: object
            status:
              description: RayStatus defines the observed state of the Ray module.
              properties:
                conditions:
                  description: Conditions is the set of condition observations for this module.
                  items:
                    description: |-
                      Condition represents an observation of a module's state at a point in time.
                      Module controllers set conditions to communicate health signals to the
                      orchestrator and to human operators.
                    properties:
                      lastHeartbeatTime:
                        description: |-
                          Deprecated: LastHeartbeatTime is present only for backward
                          compatibility with existing CRDs. New code should not set this field.
                        format: date-time
                        type: string
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from
                          one status to another.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human-readable message indicating details about the
                          transition.
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the
                          condition was set based upon. If this does not match the resource's
                          current generation, the condition is likely stale.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for
                          the condition's last transition. The value should be a CamelCase
                          string.
                        type: string
                      severity:
                        description: |-
                          Severity indicates whether this condition represents an error or is
                          purely informational. Empty string (default) indicates error severity.
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-type: atomic
                distribution:
                  description: Distribution is the platform distribution context this module is aligned to.
                  properties:
                    name:
