                  format: int64
                  type: integer
                phase:
                  description: Phase is the top-level lifecycle phase of the module.
                  type: string
                releases:
                  description: Releases is the list of deployed component releases.
                  items:
                    description: ComponentRelease describes a single software component's release metadata.
                    properties:
                      name:
                        description: Name is the component name, used as the merge key in lists.
                        type: string
                      repoUrl:
                        description: RepoURL is the source repository URL for this component release.
                        type: string
                      version:
                        description: Version is the semantic version of the component.
                        type: string
                    required:
                      - name
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - name
                  x-kubernetes-list-type: map
              type: object
          type: object
          x-kubernetes-validations:
            - message: Ray name must be default-ray
