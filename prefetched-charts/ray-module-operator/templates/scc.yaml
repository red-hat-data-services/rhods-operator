{{- if .Values.scc.enabled }}
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: run-as-ray-user
  labels:
    app.kubernetes.io/component: ray-module-operator
    app.kubernetes.io/name: ray-module-operator
allowPrivilegeEscalation: false
defaultAllowPrivilegeEscalation: false
fsGroup: {type: MustRunAs}
requiredDropCapabilities: [ALL]
runAsUser:
  type: MustRunAs
  uid: 1000
seLinuxContext: {type: MustRunAs}
seccompProfiles: [runtime/default]
users:
  - system:serviceaccount:{{ .Values.applicationsNamespace }}:kuberay-operator
{{- end }}
