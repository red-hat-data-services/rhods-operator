{{- /*
The synchronized bundle is rendered from config/openshift. Deployment and SCC
are separate templates because they contain user-configurable values.
*/ -}}
{{- $bundle := .Files.Get "files/resources.yaml" -}}
{{- $bundle = replace "__OPERATOR_NAMESPACE__" (include "ray-module-operator.namespace" .) $bundle -}}
{{- $bundle = replace "__APPLICATION_NAMESPACE__" .Values.applicationsNamespace $bundle -}}
{{- $bundle = replace "__OPERATOR_IMAGE__" (printf "%s:%s" .Values.image.repository .Values.image.tag) $bundle -}}
{{- $bundle = replace "__KUBERAY_OPERATOR_IMAGE__" .Values.relatedImages.kuberayOperator $bundle -}}
{{- $bundle = replace "__KUBE_RBAC_PROXY_IMAGE__" .Values.relatedImages.kubeRbacProxy $bundle -}}
{{ $bundle }}
