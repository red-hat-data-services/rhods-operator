apiVersion: v1
kind: Service
metadata:
  name: {{ include "odh-observability.fullname" . }}-webhook
  namespace: {{ .Values.operatorNamespace }}
  labels:
    {{- include "odh-observability.labels" . | nindent 4 }}
spec:
  ports:
    - name: webhook
      port: 9443
      targetPort: webhook
      protocol: TCP
  selector:
    {{- include "odh-observability.selectorLabels" . | nindent 4 }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "odh-observability.fullname" . }}-selfsigned
  namespace: {{ .Values.operatorNamespace }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "odh-observability.fullname" . }}-webhook-cert
  namespace: {{ .Values.operatorNamespace }}
spec:
  dnsNames:
    - {{ include "odh-observability.fullname" . }}-webhook.{{ .Values.operatorNamespace }}.svc
    - {{ include "odh-observability.fullname" . }}-webhook.{{ .Values.operatorNamespace }}.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: {{ include "odh-observability.fullname" . }}-selfsigned
  secretName: {{ include "odh-observability.fullname" . }}-webhook-cert
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "odh-observability.fullname" . }}-webhook
  annotations:
    cert-manager.io/inject-ca-from: {{ .Values.operatorNamespace }}/{{ include "odh-observability.fullname" . }}-webhook-cert
webhooks:
  - name: podmonitor-injector.opendatahub.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: {{ include "odh-observability.fullname" . }}-webhook
        namespace: {{ .Values.operatorNamespace }}
        path: /mutate-prometheus-monitors
        port: 9443
    failurePolicy: Ignore
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - {{ .Values.operatorNamespace }}
            - kube-system
    rules:
      - apiGroups: ["monitoring.coreos.com"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["podmonitors"]
        scope: Namespaced
    sideEffects: None
  - name: servicemonitor-injector.opendatahub.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: {{ include "odh-observability.fullname" . }}-webhook
        namespace: {{ .Values.operatorNamespace }}
        path: /mutate-prometheus-monitors
        port: 9443
    failurePolicy: Ignore
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - {{ .Values.operatorNamespace }}
            - kube-system
    rules:
      - apiGroups: ["monitoring.coreos.com"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["servicemonitors"]
        scope: Namespaced
    sideEffects: None
