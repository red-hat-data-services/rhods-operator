{{- if .Values.otelOperatorNamespace }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: odh-observability-opentelemetry-cert-manager
  labels:
    {{- include "odh-observability.labels" . | nindent 4 }}
rules:
  # The OTel Operator uses these resources to provision TargetAllocator mTLS
  # certificates when cert-manager is available.
  - apiGroups: ["cert-manager.io"]
    resources: ["issuers", "certificaterequests", "certificates"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: odh-observability-opentelemetry-cert-manager
  labels:
    {{- include "odh-observability.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: odh-observability-opentelemetry-cert-manager
subjects:
  - kind: ServiceAccount
    name: opentelemetry-operator-controller-manager
    namespace: {{ .Values.otelOperatorNamespace | quote }}
{{- end }}
